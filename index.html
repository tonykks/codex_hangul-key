<body><div class="app-frame"><header><div><span class="eyebrow">한 걸음씩, 천천히</span><h1 id="title">한글 글쇠 연습</h1><span id="sessionInfo" class="session-meta"></span></div><div class="header-actions"><div class="identity-actions"><nav aria-label="Language"><button data-lang="ko">한국어</button><button data-lang="my">မြန်မာ</button><button data-lang="vi">Tiếng Việt</button></nav><button id="userEmail" class="identity-button" type="button" hidden></button></div><div class="account-actions"><button id="ranking" data-i18n="ranking">랭킹</button><button id="admin" data-i18n="admin" hidden>관리자 모드</button><button id="login" class="primary" data-i18n="login">Login</button><button id="restart" data-i18n="restart" hidden>다시 시작</button><button class="save-records" id="finish" data-i18n="saveRecords" hidden>TXT 저장 · 보기</button><button class="finish" id="logout" data-i18n="logout" hidden>Logout</button></div></div></header>
<section id="authGate" class="auth-gate compact-gate"><div class="auth-card"><span class="eyebrow">한글 글쇠 연습</span><h2 data-i18n="loginTitle">Google 계정으로 시작하세요</h2><p data-i18n="loginHelp">Google 계정으로 로그인한 뒤 연습할 수 있습니다.</p><button id="loginGate" class="primary" data-i18n="googleLogin">Google 계정으로 Login</button><p id="authStatus" role="status" aria-live="polite"></p></div></section><p id="authError" role="alert" hidden></p><main id="practiceMain"><div class="cloud-banner"><span id="cloudNotice"></span><span id="cloudStatus" role="status" aria-live="polite"></span></div><div id="loadWarning" role="alert">프로그램을 불러오는 중입니다. 이 안내가 계속 보이면 폴더 안의 모든 프로그램 파일이 함께 있는지 확인하고 새로고침해 주세요.</div><noscript><p>JavaScript를 사용할 수 없어 연습을 시작할 수 없습니다.</p></noscript><div id="storageWarning" role="alert" hidden></div><section class="topbar"><div class="step"><label for="setSelect" data-i18n="chooseSet">1. 연습 세트</label><select id="setSelect"></select></div><div class="music"><label for="trackSelect" data-i18n="music">음악</label><select id="trackSelect"></select><audio id="audio" controls loop preload="metadata"></audio><small id="audioError" role="status"></small></div></section>
<section class="workspace"><aside><p class="eyebrow" data-i18n="chooseKey"></p><div id="keyChoices"></div><div class="aside-note" data-i18n="steady"></div></aside><div class="lesson"><section class="target-panel"><div><span class="eyebrow" data-i18n="target"></span><div class="target-line"><strong id="targetChar"></strong><span id="targetKey"></span></div></div><div class="instruction"><h2 id="finger"></h2><p id="rhythm"></p><details id="inputDiagnostics" hidden><summary><span data-i18n="inputCheck"></span> <small id="inputBuild"></small></summary><p data-i18n="inputCheckHelp"></p><pre id="inputTrace"></pre><a href="keyboard-check.html" target="_blank" rel="noopener">Shift 信号 / Shift signal ↗</a></details><div id="shiftCompatibility" hidden><button id="calibrateShift" data-i18n="calTitle"></button><small id="shiftProfile"></small></div></div></section><section class="guide" id="guide"><div class="guide-copy" tabindex="0"><p id="purpose"></p><p id="special"></p><p data-i18n="speak"></p></div><button id="start" class="primary" data-i18n="start"></button></section><div class="practice-status"><span id="status" role="status" aria-live="polite"></span><button id="pause" hidden data-i18n="pause"></button></div><section class="results"><div class="result-heading"><h2 data-i18n="results"></h2><span id="counts"></span></div><p class="muted" data-i18n="rowHelp"></p><div id="resultRows"></div></section>
